# Server Configuration
server.port=8080

# Application Configuration
spring.application.name=mcp-server

# OAuth2 Resource Server Configuration (JWT)
# For development/prototype, we'll use a simple configuration
# In production, this should point to a real OAuth2 provider's JWK Set URI
# For now, we'll configure JWT decoding to accept tokens from a known issuer

# JWT Configuration
mcp.jwt.secret=mcp-server-secret-key-for-jwt-validation-minimum-256-bits

# Logging
logging.level.org.springframework.security=DEBUG
logging.level.com.adrianlim83.mcpserver=DEBUG

# Domain verification token (for OAuth provider configuration)
mcp.domain.verification.token=mcp-server-verification-token-12345
